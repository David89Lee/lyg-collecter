paths:
  /api/v1/heat-loss-data:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/optical_fiber_90_service.HeatLossData'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取管道散热损失分析
      tags:
      - 光纤测温
  /api/v1/insulation-monitor-data:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 成功
