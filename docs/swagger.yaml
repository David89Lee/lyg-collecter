        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取绝热异常及定位数据
      tags:
      - 光纤测温
  /api/v1/insulation-monitor-data/{year}/{month}/{day}/{hour}:
